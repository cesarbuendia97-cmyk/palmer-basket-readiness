<title>Readiness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  /* Palmer Basket brand: navy court, orange ball, teal trim — one fixed identity, not theme-adaptive */
  :root{
    --bg:#0A1120;
    --surface:#121B2E;
    --surface-alt:#1A2540;
    --border:#283355;
    --text:#F3F5F8;
    --text-muted:#8D97AC;
    --accent:#E8732C;
    --accent-strong:#FF8A42;
    --accent-soft:#3A2416;
    --accent-2:#2F8CA0;
    --accent-2-soft:#123039;
    --good:#3FAE6A;
    --good-soft:#12331F;
    --warn:#E0A83D;
    --warn-soft:#332512;
    --critical:#E2554A;
    --critical-soft:#3A1D1A;
    --focus:#FF8A42;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Public Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:"Barlow Condensed", system-ui, sans-serif;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-wrap:balance;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button, input, textarea{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .shell{ max-width:1080px; margin:0 auto; padding:20px 16px 64px; }

  header.top{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    padding:8px 2px 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:24px;
  }
  .brand .eyebrow{
    font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); margin:0 0 2px;
  }
  .brand h1{ margin:0; font-size:34px; font-weight:700; line-height:1; color:var(--text); }
  .brand p{ margin:6px 0 0; color:var(--text-muted); font-size:14px; }
  .brand-with-crest{ display:flex; align-items:center; gap:14px; }
  .brand-with-crest .crest{ width:52px; height:52px; object-fit:contain; flex:none; }

  .segmented{
    display:inline-flex; padding:3px; background:var(--surface-alt);
    border:1px solid var(--border); border-radius:999px;
  }
  .segmented button{
    border:none; background:transparent; padding:8px 18px; border-radius:999px;
    font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .segmented button.active{ background:linear-gradient(90deg,var(--accent-2),var(--accent)); color:#fff; box-shadow:var(--shadow); }

  /* ---- Card / form ---- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:24px; box-shadow:var(--shadow);
  }
  .form-wrap{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }

  .field-label{ font-size:13px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; display:block;}

  .chiprow{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1px solid var(--border); background:var(--surface-alt); color:var(--text);
    padding:9px 16px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.ghost{ background:transparent; border-style:dashed; color:var(--text-muted); }

  .newplayer{ display:flex; gap:8px; margin-top:10px; }
  .newplayer input{ flex:1; }

  input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px;
  }
  textarea{ resize:vertical; min-height:70px; }

  .likert-block{ padding:16px 0; border-top:1px solid var(--border); }
  .likert-block:first-child{ border-top:none; padding-top:0; }
  .likert-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; gap:12px; }
  .likert-head .names{ display:flex; flex-direction:column; gap:1px; }
  .likert-head .name-en{ font-size:15px; font-weight:600; }
  .likert-head .name-es{ font-size:12px; font-weight:500; color:var(--text-muted); font-style:italic; }
  .likert-head .val{ font-size:13px; color:var(--text-muted); white-space:nowrap; padding-top:2px; }
  .likert-scale{ display:grid; grid-template-columns:repeat(9,1fr); gap:5px; }
  .likert-btn{
    border:1px solid var(--border); background:var(--surface-alt); border-radius:8px;
    padding:8px 0; font-size:13px; font-weight:700; cursor:pointer; color:var(--text);
    font-family:"IBM Plex Mono", monospace;
  }
  .likert-btn.selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .likert-caption{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-top:6px; }

  .unit{ color:var(--text-muted); font-size:14px; }

  .submit-btn{
    border:none; background:var(--accent); color:#fff; font-weight:700; font-size:15px;
    padding:14px 20px; border-radius:12px; cursor:pointer; letter-spacing:.02em;
  }
  .submit-btn:disabled{ background:var(--surface-alt); color:var(--text-muted); cursor:not-allowed; }
  .submit-btn:not(:disabled):hover{ background:var(--accent-strong); }

  .banner{
    border-radius:12px; padding:14px 16px; font-size:14px; display:flex; gap:10px; align-items:flex-start;
  }
  .banner.good{ background:var(--good-soft); color:var(--good); }
  .banner.muted{ background:var(--surface-alt); color:var(--text-muted); }
  .banner.edit{ background:var(--accent-soft); color:var(--accent-strong); }
  .banner b{ color:inherit; }

  .link-btn{ background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; padding:0; font-size:14px; text-decoration:underline; }

  /* ---- Panel ---- */
  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .stat-tile .label{ font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; }
  .stat-tile .num{ font-family:"Barlow Condensed"; font-size:36px; font-weight:700; line-height:1.1; margin-top:4px; }
  .stat-tile .num.good{ color:var(--good); }
  .stat-tile .num.warn{ color:var(--warn); }
  .stat-tile .num.critical{ color:var(--critical); }

  .date-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .date-row button{
    border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:7px 12px;
    cursor:pointer; font-size:14px; font-weight:600; color:var(--text);
  }
  .date-row button:hover{ border-color:var(--accent); }
  .date-row input[type="date"]{ padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); }

  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:var(--shadow); }
  table{ border-collapse:collapse; width:100%; min-width:760px; }
  th,td{ padding:11px 14px; text-align:left; font-size:14px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th{ font-family:"Barlow Condensed"; font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); font-weight:600; background:var(--surface-alt); position:sticky; top:0; }
  tbody tr:last-child td{ border-bottom:none; }
  td.player-col, th.player-col{ position:sticky; left:0; background:var(--surface); font-weight:600; z-index:1; }
  th.player-col{ background:var(--surface-alt); z-index:2; }
  td.note-col{ white-space:normal; max-width:220px; color:var(--text-muted); font-size:13px; }
  .score-chip{
    display:inline-block; padding:4px 12px; border-radius:999px; font-family:"IBM Plex Mono"; font-weight:600; font-size:14px;
  }
  .score-chip.good{ background:var(--good-soft); color:var(--good); }
  .score-chip.warn{ background:var(--warn-soft); color:var(--warn); }
  .score-chip.critical{ background:var(--critical-soft); color:var(--critical); }

  .empty-row td{ color:var(--text-muted); font-style:italic; }

  .pending-box{ margin-top:18px; padding:14px 16px; border:1px dashed var(--border); border-radius:12px; background:var(--surface-alt); }
  .pending-box .title{ font-size:13px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }

  .roster-manage{ margin-top:28px; }
  .roster-manage summary{ cursor:pointer; font-size:13px; font-weight:600; color:var(--text-muted); }
  .roster-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .roster-pill{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:6px 6px 6px 14px; font-size:13px;
  }
  .roster-pill button{ border:none; background:var(--surface-alt); color:var(--text-muted); width:20px; height:20px; border-radius:50%; cursor:pointer; font-size:13px; line-height:1;}
  .roster-pill button:hover{ background:var(--critical-soft); color:var(--critical); }

  .conn-error{ text-align:center; padding:60px 20px; color:var(--text-muted); }

  [hidden]{ display:none !important; }
</style>

      <h1>Readiness</h1>
      <p>Cada jugador responde al despertar &middot; el cuerpo técnico ve la tabla en vivo</p>
    </div>
      </div>
    <div class="segmented" id="segmented">
      <button data-view="form" class="active">Cuestionario</button>
      <button data-view="panel">Panel</button>
    </div>
  </header>

  <main id="app">
    <div class="conn-error">Cargando&hellip;</div>
  </main>
</div>

<script>
(function(){
  var DIMENSIONS = [
    { key:'sleep',    short:'Sueño',  nameEn:'How did you sleep?', nameEs:'¿Qué tal dormiste?', loEn:'Terrible', loEs:'Fatal', hiEn:'Great', hiEs:'Genial', direction:'higher-better' },
    { key:'soreness', short:'Dolor',  nameEn:'How sore are your muscles?', nameEs:'¿Cuánto te duelen los músculos?', loEn:'Not at all', loEs:'Nada', hiEn:'A lot', hiEs:'Muchísimo', direction:'higher-worse' },
    { key:'fatigue',  short:'Fatiga', nameEn:'How fatigued are you?', nameEs:'¿Cómo de fatigado estás?', loEn:'Not at all', loEs:'Nada', hiEn:'Exhausted', hiEs:'Agotado', direction:'higher-worse' },
    { key:'stress',   short:'Estrés', nameEn:'How stressed are you?', nameEs:'¿Cómo estás de estresado?', loEn:'Not at all', loEs:'Nada', hiEn:'Very stressed', hiEs:'Muy estresado', direction:'higher-worse' }
  ];
  var SCALE_MIN = 1;
  var SCALE_MAX = 9;
  var SCALE_RANGE = SCALE_MAX - SCALE_MIN;

  var db = null;
  var players = [];               // [{id,name}]
  var responsesToday = {};        // playerId -> doc data, for currentDate
  var unsubPlayers = null, unsubResponses = null;
  var currentDate = todayStr();
  var view = localStorage.getItem('pm_view') || 'form';
  var selectedPlayerId = localStorage.getItem('pm_player') || null;
  var loadedResponseForKey = null; // date+player key already loaded into form
  var answers = blankAnswers();
  var justSubmitted = false;
  var lastSubmitted = null; // {playerId, score} — local echo so the confirmation banner works even where reads are locked down
  var newPlayerDraft = '';
  var showNewPlayerInput = false;
  var panelUnlocked = false;
  var lockError = '';
  var auth = null;
  var currentUser = null;
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyBoY2YWYHYbv-xdr2PkX7drH7xQ5W5R598",
    authDomain: "palmer-basket-readiness.firebaseapp.com",
    projectId: "palmer-basket-readiness",
    storageBucket: "palmer-basket-readiness.firebasestorage.app",
    messagingSenderId: "1082683484712",
    appId: "1:1082683484712:web:6a9c755dcc7dcce44e231d"
  };

  function blankAnswers(){
    return { sleep:null, soreness:null, fatigue:null, stress:null, notes:'' };
  }

  function todayStr(d){
    d = d || new Date();
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function shiftDate(dateStr, days){
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+days);
    return todayStr(d);
  }
  function formatDateHuman(dateStr){
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    return d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
  }
  function computeScore(a){
    var badness = 0;
    for (var i=0;i<DIMENSIONS.length;i++){
      var dim = DIMENSIONS[i];
      var v = a[dim.key];
      if (v===null || v===undefined) return null;
      badness += dim.direction==='higher-better' ? (SCALE_MAX-v) : (v-SCALE_MIN);
    }
    return Math.round(100 - (badness/(DIMENSIONS.length*SCALE_RANGE))*100);
  }
  function scoreTier(score){
    if (score===null || score===undefined) return 'muted';
    if (score>=80) return 'good';
    if (score>=60) return 'warn';
    return 'critical';
  }

  var app = document.getElementById('app');

  function setView(v){
    view = v;
    localStorage.setItem('pm_view', v);
    document.querySelectorAll('#segmented button').forEach(function(b){
      b.classList.toggle('active', b.dataset.view===v);
    });
    render();
  }
  document.querySelectorAll('#segmented button').forEach(function(b){
    b.classList.toggle('active', b.dataset.view===view);
    b.addEventListener('click', function(){ setView(b.dataset.view); });
  });

  function init(){
    if (FIREBASE_CONFIG.apiKey === 'PEGA_TU_API_KEY'){
      app.innerHTML = '<div class="conn-error">Falta configurar Firebase.<br>Sustituye FIREBASE_CONFIG en el codigo por los datos de tu proyecto.</div>';
      return;
    }
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      auth = firebase.auth();
    }catch(e){
      app.innerHTML = '<div class="conn-error">No se pudo conectar con Firebase. Revisa FIREBASE_CONFIG.</div>';
      return;
    }
    auth.onAuthStateChanged(function(user){
      currentUser = user;
      panelUnlocked = !!user;
      lockError = '';
      render();
    });
    subscribePlayers();
    subscribeResponses(currentDate);
    render();
  }

  function subscribePlayers(){
    if (unsubPlayers) unsubPlayers();
    unsubPlayers = db.collection('players').orderBy('name','asc').onSnapshot(function(snap){
      players = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ console.error('players', err); });
  }

  function subscribeResponses(dateStr){
    if (unsubResponses) unsubResponses();
    responsesToday = {};
    unsubResponses = db.collection('responses').where('date','==',dateStr).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){
        var data = d.data();
        map[data.playerId] = data;
      });
      responsesToday = map;
      maybeLoadFormAnswer();
      render();
    }, function(err){ console.error('responses', err); });
  }

  function maybeLoadFormAnswer(){
    if (!selectedPlayerId) return;
    var key = currentDate + '__' + selectedPlayerId;
    if (loadedResponseForKey === key) return;
    loadedResponseForKey = key;
    var existing = responsesToday[selectedPlayerId];
    if (existing){
      answers = {
        sleep: existing.sleep, soreness: existing.soreness,
        fatigue: existing.fatigue, stress: existing.stress,
        notes: existing.notes || ''
      };
      justSubmitted = false;
    } else {
      answers = blankAnswers();
    }
  }

  async function addPlayer(name){
    name = (name||'').trim();
    if (!name) return;
    var ref = await db.collection('players').add({ name: name, createdAt: Date.now() });
    selectPlayer(ref.id);
    showNewPlayerInput = false;
    newPlayerDraft = '';
  }
  async function removePlayer(id){
    await db.collection('players').doc(id).delete();
    if (selectedPlayerId === id){ selectedPlayerId = null; localStorage.removeItem('pm_player'); }
    render();
  }

  function selectPlayer(id){
    selectedPlayerId = id;
    localStorage.setItem('pm_player', id);
    loadedResponseForKey = null;
    justSubmitted = false;
    maybeLoadFormAnswer();
    render();
  }

  async function submitForm(){
    var score = computeScore(answers);
    if (score === null) return;
    var playerName = (players.find(function(p){ return p.id===selectedPlayerId; })||{}).name || '';
    var docId = currentDate + '_' + selectedPlayerId;
    await db.doc('responses/' + docId).set({
      playerId: selectedPlayerId,
      playerName: playerName,
      date: currentDate,
      sleep: answers.sleep,
      soreness: answers.soreness,
      fatigue: answers.fatigue,
      stress: answers.stress,
      notes: answers.notes.trim(),
      score: score,
      submittedAt: Date.now()
    });
    justSubmitted = true;
    lastSubmitted = { playerId: selectedPlayerId, score: score };
    render();
  }

  function el(html){
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }

  function render(){
    if (!db) return;
    app.innerHTML = '';
    app.appendChild(view === 'form' ? renderForm() : renderPanel());
  }

  function renderForm(){
    var wrap = el('<div class="form-wrap"></div>');

    // player selector
    var playerCard = el('<div class="card"></div>');
    playerCard.appendChild(el('<label class="field-label">¿Quién responde?</label>'));
    var chipRow = el('<div class="chiprow"></div>');
    players.forEach(function(p){
      var chip = el('<button type="button" class="chip">'+escapeHtml(p.name)+'</button>');
      if (p.id === selectedPlayerId) chip.classList.add('selected');
      chip.addEventListener('click', function(){ selectPlayer(p.id); });
      chipRow.appendChild(chip);
    });
    var addChip = el('<button type="button" class="chip ghost">+ Nuevo jugador</button>');
    addChip.addEventListener('click', function(){ showNewPlayerInput = !showNewPlayerInput; render(); });
    chipRow.appendChild(addChip);
    playerCard.appendChild(chipRow);

    if (showNewPlayerInput){
      var np = el('<div class="newplayer"></div>');
      var input = el('<input type="text" placeholder="Nombre del jugador">');
      input.value = newPlayerDraft;
      input.addEventListener('input', function(){ newPlayerDraft = input.value; });
      input.addEventListener('keydown', function(e){ if (e.key==='Enter') addPlayer(input.value); });
      var btn = el('<button type="button" class="chip">Añadir</button>');
      btn.addEventListener('click', function(){ addPlayer(input.value); });
      np.appendChild(input); np.appendChild(btn);
      playerCard.appendChild(np);
    }
    wrap.appendChild(playerCard);

    if (!selectedPlayerId){
      wrap.appendChild(el('<div class="banner muted">Selecciona tu nombre para rellenar el parte de hoy.</div>'));
      return wrap;
    }

    var existing = responsesToday[selectedPlayerId];
    var justNow = (justSubmitted && lastSubmitted && lastSubmitted.playerId===selectedPlayerId) ? lastSubmitted : null;
    if (justNow){
      var goodBanner = el('<div class="banner good"><span>&#10003;</span><div><b>Enviado.</b> Readiness de hoy: '+justNow.score+'/100. Si algo cambia, puedes volver a enviarlo.</div></div>');
      wrap.appendChild(goodBanner);
    } else if (existing){
      wrap.appendChild(el('<div class="banner edit">Ya respondiste hoy (readiness '+existing.score+'/100). Editando tu respuesta.</div>'));
    }

    var formCard = el('<div class="card"></div>');
    formCard.appendChild(el('<h2 style="margin-top:0;font-size:22px;">'+capitalize(formatDateHuman(currentDate))+'</h2>'));

    DIMENSIONS.forEach(function(dim){
      var block = el('<div class="likert-block"></div>');
      var head = el('<div class="likert-head"><div class="names"><span class="name-en"></span><span class="name-es"></span></div><span class="val"></span></div>');
      head.querySelector('.name-en').textContent = dim.nameEn;
      head.querySelector('.name-es').textContent = dim.nameEs;
      head.querySelector('.val').textContent = (answers[dim.key]!=null) ? answers[dim.key]+'/'+SCALE_MAX : '';
      block.appendChild(head);
      var scale = el('<div class="likert-scale"></div>');
      for (var i=SCALE_MIN;i<=SCALE_MAX;i++){
        (function(i){
          var b = el('<button type="button" class="likert-btn">'+i+'</button>');
          if (answers[dim.key]===i) b.classList.add('selected');
          b.addEventListener('click', function(){ answers[dim.key]=i; render(); });
          scale.appendChild(b);
        })(i);
      }
      block.appendChild(scale);
      block.appendChild(el('<div class="likert-caption"><span>'+dim.loEn+' / '+dim.loEs+'</span><span>'+dim.hiEn+' / '+dim.hiEs+'</span></div>'));
      formCard.appendChild(block);
    });

    var notesBlock = el('<div class="likert-block"></div>');
    notesBlock.appendChild(el('<label class="field-label">Notas (opcional) — molestias, dolores, contexto</label>'));
    var notesArea = el('<textarea placeholder="Ej: leve molestia en el tendón rotuliano izquierdo"></textarea>');
    notesArea.value = answers.notes;
    notesArea.addEventListener('input', function(){ answers.notes = notesArea.value; });
    notesBlock.appendChild(notesArea);
    formCard.appendChild(notesBlock);

    var submitBtn = el('<button type="button" class="submit-btn" style="margin-top:4px;">'+(existing? 'Actualizar respuesta' : 'Enviar parte de hoy')+'</button>');
    submitBtn.id = 'submitBtn';
    submitBtn.addEventListener('click', submitForm);
    formCard.appendChild(submitBtn);

    wrap.appendChild(formCard);
    setTimeout(updateSubmitState, 0);
    return wrap;
  }

  function updateSubmitState(){
    var btn = document.getElementById('submitBtn');
    if (!btn) return;
    var score = computeScore(answers);
    btn.disabled = (score===null);
  }

  function renderPanelLock(){
    var wrap = el('<div class="form-wrap"></div>');
    var card = el('<div class="card"></div>');
    card.appendChild(el('<h2 style="margin-top:0;font-size:22px;">&#128274; Panel del cuerpo técnico</h2>'));
    card.appendChild(el('<p style="color:var(--text-muted);font-size:14px;margin:-8px 0 16px;">Solo el cuerpo técnico ve las respuestas del equipo. Inicia sesión para entrar.</p>'));
    var emailInput = el('<input type="email" placeholder="Email" autocomplete="username" style="margin-bottom:8px;">');
    var passInput = el('<input type="password" placeholder="Contraseña" autocomplete="current-password">');
    card.appendChild(emailInput);
    card.appendChild(passInput);
    if (lockError) card.appendChild(el('<p style="color:var(--critical);font-size:13px;margin:8px 0 0;">'+lockError+'</p>'));
    var btn = el('<button type="button" class="submit-btn" style="margin-top:14px;">Entrar</button>');
    function tryUnlock(){
      lockError = '';
      auth.signInWithEmailAndPassword(emailInput.value.trim(), passInput.value).catch(function(err){
        lockError = 'Email o contraseña incorrectos.';
        render();
      });
    }
    btn.addEventListener('click', tryUnlock);
    passInput.addEventListener('keydown', function(e){ if (e.key==='Enter') tryUnlock(); });
    card.appendChild(btn);
    wrap.appendChild(card);
    setTimeout(function(){ emailInput.focus(); }, 0);
    return wrap;
  }

  function renderPanel(){
    if (!panelUnlocked) return renderPanelLock();

    var wrap = el('<div></div>');

    var dateRow = el('<div class="date-row"></div>');
    var prevBtn = el('<button type="button">&larr;</button>');
    prevBtn.addEventListener('click', function(){ setDate(shiftDate(currentDate,-1)); });
    var todayBtn = el('<button type="button">Hoy</button>');
    todayBtn.addEventListener('click', function(){ setDate(todayStr()); });
    var nextBtn = el('<button type="button">&rarr;</button>');
    nextBtn.addEventListener('click', function(){ setDate(shiftDate(currentDate,1)); });
    var dateInput = el('<input type="date">');
    dateInput.value = currentDate;
    dateInput.addEventListener('change', function(){ if (dateInput.value) setDate(dateInput.value); });
    dateRow.appendChild(prevBtn); dateRow.appendChild(dateInput); dateRow.appendChild(nextBtn); dateRow.appendChild(todayBtn);
    dateRow.appendChild(el('<span class="unit" style="margin-left:6px;">'+capitalize(formatDateHuman(currentDate))+'</span>'));
    var lockBtn = el('<button type="button" style="margin-left:auto;">&#128274; Bloquear</button>');
    lockBtn.addEventListener('click', function(){
      auth.signOut();
    });
    dateRow.appendChild(lockBtn);
    wrap.appendChild(dateRow);

    var rows = players.map(function(p){
      var r = responsesToday[p.id];
      return { player:p, r:r };
    });
    var submitted = rows.filter(function(x){ return x.r; });
    var pending = rows.filter(function(x){ return !x.r; });
    var avg = submitted.length ? Math.round(submitted.reduce(function(s,x){ return s+x.r.score; },0)/submitted.length) : null;
    var alerts = submitted.filter(function(x){ return x.r.score < 60 || (x.r.notes && x.r.notes.trim()); }).length;

    var stats = el('<div class="stat-row"></div>');
    stats.appendChild(statTile('Media del equipo', avg===null? '—' : avg, avg===null?'':scoreTier(avg)));
    stats.appendChild(statTile('Respondido', submitted.length + ' / ' + players.length, submitted.length===players.length && players.length>0 ? 'good':''));
    stats.appendChild(statTile('Alertas', alerts, alerts>0?'critical':'good'));
    wrap.appendChild(stats);

    var tableWrap = el('<div class="table-wrap"></div>');
    var table = el('<table></table>');
    var thead = el('<thead><tr>'+
      '<th class="player-col">Jugador</th>'+
      DIMENSIONS.map(function(d){ return '<th>'+d.short+'</th>'; }).join('')+
      '<th>Nota</th><th>Hora</th><th>Readiness</th>'+
      '</tr></thead>');
    table.appendChild(thead);
    var tbody = el('<tbody></tbody>');

    var sorted = submitted.slice().sort(function(a,b){ return a.r.score - b.r.score; });
    if (sorted.length===0){
      tbody.appendChild(el('<tr class="empty-row"><td colspan="'+(3+DIMENSIONS.length)+'">Nadie ha respondido este día todavía.</td></tr>'));
    }
    sorted.forEach(function(x){
      var r = x.r;
      var tr = el('<tr></tr>');
      tr.appendChild(el('<td class="player-col">'+escapeHtml(x.player.name)+'</td>'));
      DIMENSIONS.forEach(function(d){
        tr.appendChild(el('<td class="mono">'+r[d.key]+'</td>'));
      });
      tr.appendChild(el('<td class="note-col">'+(r.notes? escapeHtml(r.notes) : '—')+'</td>'));
      tr.appendChild(el('<td class="mono">'+new Date(r.submittedAt).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'</td>'));
      var chip = el('<td><span class="score-chip"></span></td>');
      var chipEl = chip.querySelector('.score-chip');
      chipEl.classList.add(scoreTier(r.score));
      chipEl.textContent = r.score;
      tr.appendChild(chip);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    wrap.appendChild(tableWrap);

    if (pending.length){
      var pbox = el('<div class="pending-box"><div class="title">Pendientes de hoy</div></div>');
      var chipsRow = el('<div class="chiprow"></div>');
      pending.forEach(function(x){ chipsRow.appendChild(el('<span class="chip" style="cursor:default;">'+escapeHtml(x.player.name)+'</span>')); });
      pbox.appendChild(chipsRow);
      wrap.appendChild(pbox);
    }

    var manage = el('<details class="roster-manage"><summary>Gestionar plantilla</summary></details>');
    var manageBody = el('<div></div>');
    var rosterList = el('<div class="roster-list"></div>');
    players.forEach(function(p){
      var pill = el('<div class="roster-pill"><span></span><button type="button">&times;</button></div>');
      pill.querySelector('span').textContent = p.name;
      pill.querySelector('button').addEventListener('click', function(){
        if (confirm('¿Quitar a '+p.name+' de la plantilla? Sus respuestas anteriores se conservan.')) removePlayer(p.id);
      });
      rosterList.appendChild(pill);
    });
    manageBody.appendChild(rosterList);
    var np = el('<div class="newplayer" style="margin-top:12px;max-width:320px;"></div>');
    var npInput = el('<input type="text" placeholder="Nombre del nuevo jugador">');
    var npBtn = el('<button type="button" class="chip">Añadir</button>');
    npBtn.addEventListener('click', function(){ addPlayer(npInput.value); npInput.value=''; });
    npInput.addEventListener('keydown', function(e){ if (e.key==='Enter'){ addPlayer(npInput.value); npInput.value=''; } });
    np.appendChild(npInput); np.appendChild(npBtn);
    manageBody.appendChild(np);
    manage.appendChild(manageBody);
    wrap.appendChild(manage);

    return wrap;
  }

  function statTile(label, value, tone){
    var t = el('<div class="stat-tile"><div class="label"></div><div class="num"></div></div>');
    t.querySelector('.label').textContent = label;
    var num = t.querySelector('.num');
    num.textContent = value;
    if (tone) num.classList.add(tone);
    return t;
  }
  function setDate(d){
    currentDate = d;
    subscribeResponses(d);
    render();
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  init();
})();
</script>
