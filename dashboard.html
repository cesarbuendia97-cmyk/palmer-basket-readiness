<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmer Pulse</title>
<meta name="description" content="Panel del cuerpo técnico de Palmer Basket: Readiness diario y RPE post-sesión en un mismo sitio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  /* Same fixed dark identity as Readiness: navy court, orange ball, teal trim */
  :root{
    --bg:#0A1120; --bg-elevated:#121B2E; --bg-sunk:#1A2540;
    --ink:#F3F5F8; --ink-soft:#B9C2D6; --ink-faint:#8D97AC;
    --line:#283355; --line-strong:#3A4568;
    --teal:#2F8CA0; --teal-strong:#4FB0C4; --teal-tint:#123039;
    --tangerine:#E8732C; --tangerine-strong:#FF8A42; --tangerine-tint:#3A2416;
    --good:#3FAE6A; --good-tint:#12331F;
    --warn:#E0A83D; --warn-tint:#332512;
    --critical:#E2554A; --critical-tint:#3A1D1A;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 10px 28px -14px rgba(0,0,0,.6);
    --grad-dusk:linear-gradient(125deg,#123039 0%,#16233D 40%,#241B33 62%,#5C2E1C 82%,#E8732C 100%);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Big Shoulders Display","Manrope",sans-serif;font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;}
  .num{font-family:"Big Shoulders Display",sans-serif;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  :focus-visible{outline:none;box-shadow:0 0 0 3px rgba(222,106,44,.35);border-radius:6px;}

  /* ---- login ---- */
  #login{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #login .bg{position:absolute;inset:0;background:var(--grad-dusk);}
  #login .card{position:relative;z-index:2;width:360px;background:rgba(21,32,30,.34);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:36px 32px 30px;box-shadow:0 30px 60px -20px rgba(9,25,22,.55);color:#fff;text-align:center;}
  #login .crest{width:56px;height:56px;border-radius:12px;margin-bottom:14px;}
  #login h1{font-size:24px;color:#fff;margin-bottom:4px;text-transform:uppercase;}
  #login .sub{font-size:13px;color:rgba(255,255,255,.75);margin:0 0 24px;}
  #login .field{text-align:left;margin-bottom:14px;}
  #login label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:6px;}
  #login input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(8,18,16,.35);color:#fff;font-size:14.5px;font-family:inherit;}
  #login .btn{width:100%;padding:12px;border:none;border-radius:10px;margin-top:8px;background:var(--tangerine);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;}
  #login .btn:hover{background:var(--tangerine-strong);}
  #login .err{margin-top:12px;font-size:12.5px;color:#FFD7CC;min-height:16px;}

  /* ---- chrome ---- */
  #app{display:block;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;background:var(--bg-elevated);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand img{width:36px;height:36px;border-radius:8px;}
  .brand .word{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:19px;letter-spacing:.02em;text-transform:uppercase;}
  .brand .tag{font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:-2px;}
  .signout{background:none;border:none;color:var(--ink-faint);font-size:12px;cursor:pointer;text-decoration:underline;}
  .main{max-width:1180px;margin:0 auto;padding:22px 26px 60px;}
  .back-btn{border:1px solid var(--line-strong);background:var(--bg-elevated);color:var(--ink);font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;margin-bottom:16px;}
  .back-btn:hover{border-color:var(--teal);color:var(--teal);}

  /* ---- summary ---- */
  .summary{background:var(--bg-elevated);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow-1);display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-bottom:20px;}
  .sum-figure .label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .sum-figure .value{font-size:44px;line-height:.9;color:var(--teal-strong);}
  .sum-figure .value.accent{color:var(--tangerine-strong);}
  .sum-figure .sub{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .sum-figure .sub b{color:var(--ink);font-family:"Big Shoulders Display",sans-serif;font-size:14px;}

  /* ---- roster ---- */
  .roster-panel{background:var(--bg-elevated);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);overflow:hidden;}
  .roster-head{display:flex;align-items:baseline;justify-content:space-between;padding:18px 22px 12px;}
  .roster-head h2{font-size:19px;text-transform:uppercase;}
  .roster-head .count{font-size:12px;color:var(--ink-faint);font-weight:600;}
  .roster-cols{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:14px;padding:0 22px 10px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);}
  .roster-row{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:14px;align-items:center;padding:12px 22px;border-top:1px solid var(--line);cursor:pointer;background:var(--bg-elevated);}
  .roster-row:hover{background:var(--bg-sunk);}
  .player-id{display:flex;align-items:center;gap:11px;min-width:0;}
  .player-avatar{width:32px;height:32px;border-radius:100px;background:var(--bg-sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Big Shoulders Display",sans-serif;font-weight:700;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
  .player-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .metric-pill{display:inline-flex;align-items:baseline;gap:4px;padding:5px 11px;border-radius:100px;font-size:13.5px;font-family:"Big Shoulders Display",sans-serif;font-weight:700;width:fit-content;}
  .metric-pill .tag{font-family:"Manrope",sans-serif;font-weight:700;font-size:9px;letter-spacing:.03em;text-transform:uppercase;opacity:.75;}
  .tier-good{background:var(--good-tint);color:var(--good);}
  .tier-warn{background:var(--warn-tint);color:var(--warn);}
  .tier-critical{background:var(--critical-tint);color:var(--critical);}
  .pending-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:100px;font-size:11px;font-weight:700;background:var(--bg-sunk);color:var(--ink-faint);border:1px dashed var(--line-strong);}
  .metric-empty{color:var(--ink-faint);font-size:12px;}
  .chevron{color:var(--ink-faint);}
  .spark{display:block;overflow:visible;}

  /* ---- connections ---- */
  .conn-panel{margin-top:20px;}
  .conn-head{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
  .conn-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .conn-chip{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:12px;background:var(--bg-elevated);border:1px solid var(--line);box-shadow:var(--shadow-1);}
  .conn-dot{width:8px;height:8px;border-radius:100px;flex-shrink:0;}
  .conn-dot--live{background:var(--good);box-shadow:0 0 0 3px var(--good-tint);}
  .conn-dot--planned{background:var(--tangerine);box-shadow:0 0 0 3px var(--tangerine-tint);}
  .conn-body{display:flex;flex-direction:column;min-width:0;}
  .conn-name{font-size:12.5px;font-weight:700;}
  .conn-desc{font-size:11px;color:var(--ink-faint);}

  /* ---- detail ---- */
  .detail-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .detail-avatar{width:52px;height:52px;border-radius:100px;background:var(--bg-sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:18px;color:var(--ink-soft);}
  .detail-title h1{font-size:25px;text-transform:uppercase;}
  .detail-title .meta{font-size:12.5px;color:var(--ink-faint);}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .panel{background:var(--bg-elevated);border:1px solid var(--line);border-radius:16px;padding:20px 20px 22px;box-shadow:var(--shadow-1);}
  .panel h3{font-size:15px;margin-bottom:14px;text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pending-badge{font-family:"Manrope",sans-serif;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--tangerine);background:var(--tangerine-tint);border:1px solid var(--tangerine);border-radius:100px;padding:3px 9px;}
  .load-quadrant{margin-top:18px;}

  /* ---- weekly board ---- */
  .week-board{margin-top:18px;}
  .board-badge{background:var(--teal-tint);color:var(--teal-strong);border-color:var(--teal);}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  @media (max-width:900px){ .week-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));} }
  .week-day{background:var(--bg-sunk);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;}
  .week-day-label{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);}
  .week-day textarea{width:100%;min-height:110px;resize:vertical;background:var(--bg-elevated);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:8px;font-family:"Manrope",sans-serif;font-size:12.5px;line-height:1.45;}
  .week-day textarea:disabled{opacity:.5;}
  .week-status{font-size:10px;color:var(--ink-faint);min-height:12px;}
  .hist-table{width:100%;border-collapse:collapse;}
  .hist-table th,.hist-table td{padding:7px 8px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line);}
  .hist-table th{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);}
  .hist-empty{color:var(--ink-faint);font-size:12.5px;padding:14px 0;}

  .conn-error{text-align:center;padding:60px 20px;color:var(--ink-faint);}
  [hidden]{display:none!important;}
</style>
</head>

      </div>
    </div>
  </header>
  <main class="main" id="main"></main>
</div>

<script>
(function(){
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyBoY2YWYHYbv-xdr2PkX7drH7xQ5W5R598",
    authDomain: "palmer-basket-readiness.firebaseapp.com",
    projectId: "palmer-basket-readiness",
    storageBucket: "palmer-basket-readiness.firebasestorage.app",
    messagingSenderId: "1082683484712",
    appId: "1:1082683484712:web:6a9c755dcc7dcce44e231d"
  };
  firebase.initializeApp(FIREBASE_CONFIG);
  var db = firebase.firestore();

  var players = [];         // [{id,name}]
  var responsesByPlayer = {}; // playerId -> [{date,score,...}] sorted asc
  var rpeByPlayer = {};        // playerId -> [{date,pista,gimnasio}] sorted asc
  var view = { screen: 'dashboard', playerId: null };
  var unsubs = [];

  subscribeAll();

  function subscribeAll(){
    unsubs.push(db.collection('players').orderBy('name','asc').onSnapshot(function(snap){
      players = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }));
    unsubs.push(db.collection('responses').orderBy('date','desc').limit(600).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){
        var r = d.data();
        if (!map[r.playerId]) map[r.playerId] = [];
        map[r.playerId].push(r);
      });
      Object.keys(map).forEach(function(pid){ map[pid].sort(function(a,b){ return a.date < b.date ? -1 : 1; }); });
      responsesByPlayer = map;
      render();
    }, function(err){ console.error('responses', err); }));
    unsubs.push(db.collection('rpe').orderBy('date','desc').limit(600).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){
        var r = d.data();
        if (!map[r.playerId]) map[r.playerId] = [];
        map[r.playerId].push(r);
      });
      Object.keys(map).forEach(function(pid){ map[pid].sort(function(a,b){ return a.date < b.date ? -1 : 1; }); });
      rpeByPlayer = map;
      render();
    }, function(err){ console.error('rpe', err); }));
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function round1(v){ return Math.round(v*10)/10; }
  function initials(name){
    var parts = name.trim().split(/\s+/);
    return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function readyTier(v){ if(v===null||v===undefined) return null; if(v>=80) return 'good'; if(v>=60) return 'warn'; return 'critical'; }
  function rpeTier(v){ if(v===null||v===undefined) return null; if(v<=4.5) return 'good'; if(v<=7.5) return 'warn'; return 'critical'; }

  function lastSessionRpe(list){
    if (!list || !list.length) return null;
    var r = list[list.length-1];
    var vals = [];
    if (typeof r.pista === 'number') vals.push(r.pista);
    if (typeof r.gimnasio === 'number' && r.gimnasio > 0) vals.push(r.gimnasio);
    if (!vals.length) return null;
    return { value: round1(vals.reduce(function(a,b){return a+b;},0)/vals.length), date: r.date };
  }

  function sparkline(list, key, color){
    var w = 96, h = 28;
    if (!list || list.length < 2) return '<span class="metric-empty">Sin datos</span>';
    var last14 = list.slice(-14);
    var vals = last14.map(function(r){ return r[key]; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max){ min -= 1; max += 1; }
    var pts = vals.map(function(v,i){
      var x = (i/(vals.length-1))*w;
      var y = h - ((v-min)/(max-min))*h;
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  var mainEl = document.getElementById('main');
  function render(){
    if (!players.length){ mainEl.innerHTML = '<p class="conn-error">Cargando plantilla…</p>'; return; }
    mainEl.innerHTML = '';
    mainEl.appendChild(view.screen === 'detail' ? renderDetail(view.playerId) : renderDashboard());
  }

  function el(html){ var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

  var DASHBOARD_HIDDEN_IDS = ['vicente', 'aguilera', 'gonzalez'];

  function renderDashboard(){
    var wrap = el('<div></div>');
    var today = todayStr();
    var visiblePlayers = players.filter(function(p){ return DASHBOARD_HIDDEN_IDS.indexOf(p.id) === -1; });

    var rows = visiblePlayers.map(function(p){
      var resp = responsesByPlayer[p.id] || [];
      var rpe = rpeByPlayer[p.id] || [];
      var todays = resp.filter(function(r){ return r.date === today; });
      var readinessToday = todays.length ? todays[todays.length-1].score : null;
      return { player: p, resp: resp, rpe: rpe, readinessToday: readinessToday, lastRpe: lastSessionRpe(rpe) };
    });

    var answered = rows.filter(function(r){ return r.readinessToday !== null; });
    var readyAvg = answered.length ? round1(answered.reduce(function(a,r){return a+r.readinessToday;},0)/answered.length) : null;
    var withRpe = rows.filter(function(r){ return r.lastRpe !== null; });
    var rpeAvg = withRpe.length ? round1(withRpe.reduce(function(a,r){return a+r.lastRpe.value;},0)/withRpe.length) : null;

    var summary = el('<div class="summary"></div>');
    summary.appendChild(statFigure('Readiness — hoy', readyAvg===null?'–':readyAvg, answered.length+'/'+visiblePlayers.length+' han respondido esta mañana', 'accent'));
    summary.appendChild(statFigure('Carga del equipo — RPE', rpeAvg===null?'–':rpeAvg, withRpe.length+'/'+visiblePlayers.length+' con última sesión registrada', ''));
    summary.appendChild(statFigure('Plantilla', visiblePlayers.length, 'jugadores en el sistema', ''));
    wrap.appendChild(summary);

    var panel = el('<div class="roster-panel"></div>');
    var head = el('<div class="roster-head"><h2>Plantilla</h2><span class="count"></span></div>');
    head.querySelector('.count').textContent = visiblePlayers.length + ' jugadores';
    panel.appendChild(head);
    panel.appendChild(el('<div class="roster-cols"><span>Jugador</span><span>Readiness · 14 días</span><span>RPE · última sesión</span><span>Readiness · hoy</span><span></span></div>'));

    var sorted = rows.slice().sort(function(a,b){
      var av = a.readinessToday===null ? 999 : a.readinessToday;
      var bv = b.readinessToday===null ? 999 : b.readinessToday;
      return av-bv;
    });
    sorted.forEach(function(r){
      var row = el('<div class="roster-row"></div>');
      var idCell = el('<div class="player-id"></div>');
      var avatar = el('<div class="player-avatar"></div>'); avatar.textContent = initials(r.player.name);
      var nameWrap = el('<div class="player-name"></div>'); nameWrap.textContent = r.player.name;
      idCell.appendChild(avatar); idCell.appendChild(nameWrap);
      row.appendChild(idCell);
      row.appendChild(el('<div>'+sparkline(r.resp, 'score', 'var(--tangerine)')+'</div>'));
      var rpeCell = r.lastRpe===null
        ? '<span class="metric-empty">Sin sesión</span>'
        : '<span class="metric-pill tier-'+rpeTier(r.lastRpe.value)+'"><span class="tag">RPE</span>'+r.lastRpe.value.toFixed(1)+'</span>';
      row.appendChild(el('<div>'+rpeCell+'</div>'));
      var readyCell = r.readinessToday===null
        ? '<span class="pending-chip">Pendiente</span>'
        : '<span class="metric-pill tier-'+readyTier(r.readinessToday)+'"><span class="tag">Ready</span>'+r.readinessToday+'</span>';
      row.appendChild(el('<div>'+readyCell+'</div>'));
      row.appendChild(el('<div class="chevron">&#8250;</div>'));
      row.addEventListener('click', function(){ view = { screen:'detail', playerId: r.player.id }; render(); });
      panel.appendChild(row);
    });
    wrap.appendChild(panel);

    var conn = el('<div class="conn-panel"><div class="conn-head">Fuentes de datos</div><div class="conn-row"></div></div>');
    var connRow = conn.querySelector('.conn-row');
    connRow.appendChild(connChip('live', 'Readiness', 'En vivo · Firebase'));
    connRow.appendChild(connChip('live', 'RPE post-sesión', 'En vivo · Microsoft Forms'));
    connRow.appendChild(connChip('planned', 'CMJ · Hawkin Dynamics', 'Pendiente de conectar'));
    connRow.appendChild(connChip('planned', 'Polar Team Pro', 'Pendiente de credenciales API'));
    wrap.appendChild(conn);

    return wrap;
  }

  function statFigure(label, value, sub, accentClass){
    var f = el('<div class="sum-figure"><div class="label"></div><div class="value num"></div><div class="sub"></div></div>');
    f.querySelector('.label').textContent = label;
    var v = f.querySelector('.value'); v.textContent = value; if (accentClass) v.classList.add(accentClass);
    f.querySelector('.sub').textContent = sub;
    return f;
  }
  function connChip(status, name, desc){
    var c = el('<div class="conn-chip"><span class="conn-dot"></span><div class="conn-body"><span class="conn-name"></span><span class="conn-desc"></span></div></div>');
    c.querySelector('.conn-dot').classList.add('conn-dot--'+status);
    c.querySelector('.conn-name').textContent = name;
    c.querySelector('.conn-desc').textContent = desc;
    return c;
  }

  function renderDetail(playerId){
    var wrap = el('<div></div>');
    var back = el('<button class="back-btn">&larr; Volver a la plantilla</button>');
    back.addEventListener('click', function(){ view = { screen:'dashboard', playerId:null }; render(); });
    wrap.appendChild(back);

    var player = players.find(function(p){ return p.id === playerId; });
    if (!player){ wrap.appendChild(el('<p class="conn-error">Jugador no encontrado.</p>')); return wrap; }
    var resp = (responsesByPlayer[playerId] || []).slice().reverse();
    var rpe = (rpeByPlayer[playerId] || []).slice().reverse();

    var header = el('<div class="detail-header"></div>');
    var avatar = el('<div class="detail-avatar"></div>'); avatar.textContent = initials(player.name);
    var titleWrap = el('<div class="detail-title"><h1></h1><div class="meta">Readiness y RPE recientes</div></div>');
    titleWrap.querySelector('h1').textContent = player.name;
    header.appendChild(avatar); header.appendChild(titleWrap);
    wrap.appendChild(header);

    var grid = el('<div class="detail-grid"></div>');

    var readyPanel = el('<div class="panel"><h3>Readiness — últimos días</h3></div>');
    if (resp.length){
      var rTable = el('<table class="hist-table"><thead><tr><th>Fecha</th><th>Sueño</th><th>Dolor</th><th>Fatiga</th><th>Estrés</th><th>Readiness</th></tr></thead><tbody></tbody></table>');
      var rBody = rTable.querySelector('tbody');
      resp.slice(0,14).forEach(function(r){
        rBody.appendChild(el('<tr><td>'+r.date+'</td><td>'+(r.sleep!=null?r.sleep:'–')+'</td><td>'+(r.soreness!=null?r.soreness:'–')+'</td><td>'+(r.fatigue!=null?r.fatigue:'–')+'</td><td>'+(r.stress!=null?r.stress:'–')+'</td><td><span class="metric-pill tier-'+readyTier(r.score)+'">'+r.score+'</span></td></tr>'));
      });
      readyPanel.appendChild(rTable);
    } else {
      readyPanel.appendChild(el('<p class="hist-empty">Sin respuestas de Readiness todavía.</p>'));
    }
    grid.appendChild(readyPanel);

    var rpePanel = el('<div class="panel"><h3>RPE post-sesión — últimas sesiones</h3></div>');
    if (rpe.length){
      var pTable = el('<table class="hist-table"><thead><tr><th>Fecha</th><th>Pista</th><th>Gimnasio</th></tr></thead><tbody></tbody></table>');
      var pBody = pTable.querySelector('tbody');
      rpe.slice(0,14).forEach(function(r){
        pBody.appendChild(el('<tr><td>'+r.date+'</td><td><span class="metric-pill tier-'+rpeTier(r.pista)+'">'+r.pista+'</span></td><td>'+(r.gimnasio>0? '<span class="metric-pill tier-'+rpeTier(r.gimnasio)+'">'+r.gimnasio+'</span>' : '<span class="metric-empty">—</span>')+'</td></tr>'));
      });
      rpePanel.appendChild(pTable);
    } else {
      rpePanel.appendChild(el('<p class="hist-empty">Sin sesiones de RPE registradas.</p>'));
    }
    grid.appendChild(rpePanel);

    wrap.appendChild(grid);
    wrap.appendChild(renderLoadQuadrant(rpe));
    wrap.appendChild(renderWeeklyBoard(playerId));
    return wrap;
  }

  function renderWeeklyBoard(playerId){
    var panel = el('<div class="panel week-board"><h3>Tablón semanal <span class="pending-badge board-badge">Compartido con el prepa</span></h3></div>');
    var days = [
      {key:'mon', label:'Lunes'}, {key:'tue', label:'Martes'}, {key:'wed', label:'Miércoles'},
      {key:'thu', label:'Jueves'}, {key:'fri', label:'Viernes'}, {key:'sat', label:'Sábado'}, {key:'sun', label:'Domingo'}
    ];
    var gridEl = el('<div class="week-grid"></div>');
    var textareas = {};
    days.forEach(function(d){
      var card = el('<div class="week-day"></div>');
      var label = el('<div class="week-day-label"></div>'); label.textContent = d.label;
      var ta = el('<textarea placeholder="Ejercicios / notas…"></textarea>');
      ta.disabled = true;
      var status = el('<div class="week-status"></div>');
      ta.addEventListener('blur', function(){
        status.textContent = 'Guardando…';
        var patch = { updatedAt: Date.now() };
        patch[d.key] = ta.value;
        db.collection('training_plans').doc(playerId).set(patch, { merge:true }).then(function(){
          status.textContent = 'Guardado';
          setTimeout(function(){ status.textContent = ''; }, 1500);
        }).catch(function(){ status.textContent = 'Error al guardar'; });
      });
      card.appendChild(label);
      card.appendChild(ta);
      card.appendChild(status);
      textareas[d.key] = ta;
      gridEl.appendChild(card);
    });
    panel.appendChild(gridEl);

    db.collection('training_plans').doc(playerId).get().then(function(doc){
      var data = doc.exists ? doc.data() : {};
      days.forEach(function(d){ textareas[d.key].value = data[d.key] || ''; textareas[d.key].disabled = false; });
    }).catch(function(){
      days.forEach(function(d){ textareas[d.key].disabled = false; });
    });

    return panel;
  }

  function renderLoadQuadrant(rpeAsc){
    // rpeAsc is newest-first here (already reversed for display); use chronological order for the baseline.
    var chrono = rpeAsc.slice().reverse();
    var sessionVals = chrono.map(function(r){
      var vals = [];
      if (typeof r.pista === 'number') vals.push(r.pista);
      if (typeof r.gimnasio === 'number' && r.gimnasio > 0) vals.push(r.gimnasio);
      return vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
    }).filter(function(v){ return v !== null; });

    var panel = el('<div class="panel load-quadrant"><h3>Carga interna vs. externa <span class="pending-badge">Externa: pendiente de Polar</span></h3></div>');

    if (sessionVals.length < 2){
      panel.appendChild(el('<p class="hist-empty">Hacen falta al menos 2 sesiones de RPE para calcular la carga interna de este jugador.</p>'));
      return panel;
    }

    var avg = sessionVals.reduce(function(a,b){return a+b;},0)/sessionVals.length;
    var last = sessionVals[sessionVals.length-1];
    var deviation = last - avg; // + = más duro de lo habitual para ESTE jugador, - = más suave
    var clamped = Math.max(-4, Math.min(4, deviation));

    var size = 260, pad = 34;
    var plot = size - pad*2;
    var cx = size/2, cy = size/2;
    var py = cy - (clamped/4) * (plot/2); // deviation>0 (mas duro) sube
    var px = cx; // eje externo aun sin datos reales: se marca en el centro

    var svg = ''+
      '<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:340px;display:block;margin:0 auto;">'+
        '<rect x="'+pad+'" y="'+pad+'" width="'+plot+'" height="'+plot+'" fill="var(--bg-sunk)" rx="10"/>'+
        '<line x1="'+cx+'" y1="'+pad+'" x2="'+cx+'" y2="'+(size-pad)+'" stroke="var(--line-strong)" stroke-width="1.5"/>'+
        '<line x1="'+pad+'" y1="'+cy+'" x2="'+(size-pad)+'" y2="'+cy+'" stroke="var(--line-strong)" stroke-width="1.5"/>'+
        '<line x1="'+px+'" y1="'+pad+'" x2="'+px+'" y2="'+(size-pad)+'" stroke="var(--tangerine)" stroke-width="1.5" stroke-dasharray="3,4" opacity=".6"/>'+
        '<text x="'+(pad+8)+'" y="'+(pad+16)+'" font-size="8.5" font-weight="700" fill="var(--ink-faint)" style="text-transform:uppercase;letter-spacing:.04em;">Fatiga / poca prep.</text>'+
        '<text x="'+(size-pad-8)+'" y="'+(pad+16)+'" font-size="8.5" font-weight="700" fill="var(--ink-faint)" text-anchor="end" style="text-transform:uppercase;letter-spacing:.04em;">Alto estrés</text>'+
        '<text x="'+(pad+8)+'" y="'+(size-pad-8)+'" font-size="8.5" font-weight="700" fill="var(--ink-faint)" style="text-transform:uppercase;letter-spacing:.04em;">Baja demanda / recup.</text>'+
        '<text x="'+(size-pad-8)+'" y="'+(size-pad-8)+'" font-size="8.5" font-weight="700" fill="var(--ink-faint)" text-anchor="end" style="text-transform:uppercase;letter-spacing:.04em;">Buena adaptación</text>'+
        '<circle cx="'+px+'" cy="'+py+'" r="7" fill="'+(clamped>0.3?'var(--critical)':clamped<-0.3?'var(--teal)':'var(--ink-faint)')+'" stroke="var(--bg-elevated)" stroke-width="2"/>'+
        '<text x="'+(size/2)+'" y="'+(size-10)+'" font-size="9" fill="var(--ink-faint)" text-anchor="middle">Carga externa (Polar) &#8594;</text>'+
        '<text x="12" y="'+(size/2)+'" font-size="9" fill="var(--ink-faint)" text-anchor="middle" transform="rotate(-90 12 '+(size/2)+')">Carga interna (RPE) &#8593;</text>'+
      '</svg>';
    panel.appendChild(el('<div>'+svg+'</div>'));
    panel.appendChild(el('<p class="hist-empty" style="text-align:center;">Última sesión '+(deviation>=0?'+':'')+round1(deviation)+' respecto a su media personal ('+round1(avg)+'). El eje horizontal se activará cuando conectemos Polar Team Pro.</p>'));
    return panel;
  }
})();
</script>
</body>
</html>
